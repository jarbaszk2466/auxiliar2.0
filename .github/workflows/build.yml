name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.37
          pip install virtualenv

      - name: Instalar Android SDK
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip

          unzip -q tools.zip

          mkdir -p cmdline-tools/latest

          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true

          export ANDROID_SDK_ROOT=$HOME/android-sdk

          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROIDSDK=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Criar buildozer.spec
        run: |
          APP_DIR=$(dirname $(find . -name main.py | head -1))
          cd "$APP_DIR"

          buildozer init

          sed -i 's/^title = .*/title = Mesa de Luz/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = mesadeluz/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd,pyjnius/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv/' buildozer.spec

          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec

      - name: Compilar APK
        run: |
          APP_DIR=$(dirname $(find . -name main.py | head -1))
          cd "$APP_DIR"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: '**/bin/*.apk'
